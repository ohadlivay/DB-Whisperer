    <path class="network" d="M1242 547 H1318 Q1336 547 1336 330 H1347"/>
    <path class="network" d="M1242 714 H1292 Q1304 714 1304 355 H1347"/>
    <path class="network" d="M1242 587 H1347"/>
    <text class="edge-label" x="1251" y="574">SELECT + rows</text>
    <path d="M814 750 H825 V801 H1320 Q1347 801 1347 763" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 6" marker-end="url(#arrowSlate)"/>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(54 848)">
    <path d="M0 0h42" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
    <text class="legend" x="54" y="5">runtime / control</text>
    <path d="M198 0h42" stroke="#0891b2" stroke-width="2.1" stroke-dasharray="7 6" marker-end="url(#arrowCyan)"/>
