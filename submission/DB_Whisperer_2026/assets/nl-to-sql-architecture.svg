    <text class="component-title" x="1412" y="760" font-size="19">JSONL log</text>
    <text class="small" x="1371" y="789">Prompts · responses · events</text>
  </g>

  <!-- Runtime connections -->
  <g id="connections">
    <path class="runtime" d="M212 349 H292"/>
    <text class="edge-label" x="223" y="337">CSV + question</text>
    <path class="return" d="M292 476 H212"/>
    <text class="edge-label" x="222" y="499" fill="#047857">result / clarification</text>

    <path class="runtime" d="M508 352 H556"/>
    <text class="edge-label" x="516" y="339">request</text>
    <path class="return" d="M556 468 H508"/>
    <text class="edge-label" x="513" y="489" fill="#047857">workflow</text>

    <path class="runtime" d="M814 275 H867"/>
    <text class="edge-label" x="821" y="261">uploads</text>
    <path class="evidence" d="M867 298 H834 Q814 298 814 318"/>
    <text class="edge-label" x="820" y="319" fill="#08758d">schema</text>

    <path class="runtime" d="M814 382 H867"/>

