    <circle cx="1383" cy="740" r="17" fill="#f1f5f9"/>
    <path d="M1377 731h9l4 4v14h-13zM1386 731v5h4M1380 741h7M1380 745h7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
