    <rect x="1347" y="218" width="207" height="8" rx="4" fill="#64748b"/>
    <circle cx="1384" cy="263" r="19" fill="#f1f5f9"/>
    <path d="M1384 252l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
    <text class="component-kicker" x="1415" y="255" fill="#64748b">EXTERNAL LLM</text>
    <text class="component-title" x="1415" y="280">OpenRouter</text>
    <text class="component-copy" x="1371" y="316">Schema linking + SQL</text>
    <text class="component-copy" x="1371" y="342">Semantic + ambiguity</text>
    <text class="component-copy" x="1371" y="365">judgments</text>
  </g>

  <g id="duckdb" filter="url(#smallShadow)">
