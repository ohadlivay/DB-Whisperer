<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DB Whisperer natural-language-to-SQL application architecture</title>
  <desc id="desc">A component diagram showing the analyst and Streamlit interface, ApplicationService orchestration, ETL, semantic analysis, parallel SQL querying, ambiguity judging, OpenRouter, DuckDB, shared contracts, and the clarification loop.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="orchestrator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#e7f0ff"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#bfdbfe" opacity="0.35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#17365d" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17365d" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c58a18"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0b1c30; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #2563eb; }
      .title { font-size: 32px; font-weight: 750; letter-spacing: -0.7px; }
      .subtitle { font-size: 17px; fill: #526171; }
      .boundary-label { font-size: 12px; font-weight: 750; letter-spacing: 1.35px; fill: #1e40af; }
      .component-kicker { font-size: 12px; font-weight: 750; letter-spacing: 1.15px; }
      .component-title { font-size: 21px; font-weight: 720; letter-spacing: -0.25px; }
      .component-copy { font-size: 15.5px; fill: #43546a; }
      .component-copy-strong { font-size: 15.5px; font-weight: 650; fill: #243b53; }
      .small { font-size: 13.5px; fill: #526171; }
      .edge-label { font-size: 12.5px; font-weight: 650; fill: #4b6179; }
      .legend { font-size: 12.5px; fill: #526171; }
      .number { font-size: 12px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .card { fill: #ffffff; stroke: #d8e5f4; stroke-width: 1.4; }
      .runtime { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .return { fill: none; stroke: #059669; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .evidence { fill: none; stroke: #0891b2; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrowCyan); }
      .feedback { fill: none; stroke: #c58a18; stroke-width: 2.7; marker-end: url(#arrowGold); }
      .network { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 5; marker-start: url(#arrowSlate); marker-end: url(#arrowSlate); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <g id="heading">
    <text class="eyebrow" x="54" y="48">SYSTEM ARCHITECTURE · PRODUCTION</text>
    <text class="title" x="54" y="84">Natural language → safe, clarified SQL</text>
    <text class="subtitle" x="54" y="113">The implemented Streamlit workflow, its service boundaries, and the two external runtimes it depends on.</text>
    <g transform="translate(1336 44)">
      <rect width="210" height="34" rx="17" fill="#e8f7f1" stroke="#a7ddc8"/>
      <circle cx="19" cy="17" r="5" fill="#059669"/>
      <text x="33" y="22" font-size="13" font-weight="750" fill="#006c49">CURRENT IMPLEMENTATION</text>
    </g>
  </g>

  <g id="application-boundary">
    <rect x="247" y="142" width="1056" height="668" rx="30" fill="#ffffff" stroke="#cfe0f5" stroke-width="1.6" filter="url(#shadow)"/>
    <rect x="247" y="142" width="1056" height="668" rx="30" fill="url(#dots)" opacity="0.32"/>
    <g transform="translate(278 159)">
      <rect width="212" height="29" rx="14.5" fill="#eaf2ff"/>
      <text class="boundary-label" x="15" y="19">DB WHISPERER CORE</text>
    </g>
  </g>

  <!-- External actor -->
  <g id="analyst" filter="url(#smallShadow)">
    <rect class="card" x="42" y="284" width="170" height="234" rx="22"/>
    <circle cx="82" cy="329" r="22" fill="#eaf2ff"/>
    <circle cx="82" cy="322" r="7" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <path d="M68 341c3-9 24-9 28 0" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
    <text class="component-kicker" x="112" y="320" fill="#2563eb">ACTOR</text>
    <text class="component-title" x="112" y="344">Analyst</text>
    <line x1="62" y1="366" x2="192" y2="366" stroke="#e1eaf4"/>
    <circle cx="67" cy="393" r="3" fill="#2563eb"/>
    <text class="component-copy" x="80" y="398">Selects CSVs</text>
    <circle cx="67" cy="426" r="3" fill="#2563eb"/>
    <text class="component-copy" x="80" y="431">Asks a question</text>
    <circle cx="67" cy="459" r="3" fill="#c58a18"/>
    <text class="component-copy" x="80" y="464">Chooses meaning</text>
    <circle cx="67" cy="492" r="3" fill="#059669"/>
    <text class="component-copy" x="80" y="497">Reviews SQL + rows</text>
  </g>

  <!-- Interface -->
  <g id="streamlit-ui" filter="url(#smallShadow)">
    <rect class="card" x="292" y="244" width="216" height="374" rx="22"/>
    <rect x="292" y="244" width="216" height="8" rx="4" fill="#2563eb"/>
    <circle cx="329" cy="290" r="20" fill="#eaf2ff"/>
    <rect x="317" y="281" width="24" height="16" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M325 301h8M329 297v4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <circle cx="478" cy="271" r="14" fill="#2563eb"/>
    <text class="number" x="478" y="271">1</text>
    <text class="component-kicker" x="362" y="282" fill="#2563eb">INTERFACE</text>
    <text class="component-title" x="362" y="307">Streamlit UI</text>
    <line x1="316" y1="329" x2="484" y2="329" stroke="#e1eaf4"/>
    <text class="component-copy-strong" x="316" y="360">Session workspace</text>
    <text class="component-copy" x="316" y="389">Upload / dataset controls</text>
    <text class="component-copy" x="316" y="419">Question + model controls</text>
    <text class="component-copy" x="316" y="449">Schema preview</text>
    <text class="component-copy" x="316" y="479">Results + generated SQL</text>
    <g transform="translate(316 510)">
      <rect width="168" height="72" rx="12" fill="#fff8e8" stroke="#f0d59b"/>
      <text x="14" y="25" font-size="13" font-weight="750" fill="#9a6810">CLARIFICATION UI</text>
      <text class="small" x="14" y="49">One question · 2 options</text>
    </g>
  </g>

  <!-- Application orchestration -->
  <g id="application-service" filter="url(#smallShadow)">
    <rect x="556" y="220" width="258" height="405" rx="24" fill="url(#orchestrator)" stroke="#a8c6ef" stroke-width="1.6"/>
    <circle cx="595" cy="267" r="21" fill="#2563eb"/>
    <path d="M585 267h20M595 257v20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="786" cy="248" r="14" fill="#2563eb"/>
    <text class="number" x="786" y="248">2</text>
    <text class="component-kicker" x="628" y="259" fill="#1e40af">ORCHESTRATOR</text>
    <text class="component-title" x="628" y="285">ApplicationService</text>
    <line x1="581" y1="309" x2="789" y2="309" stroke="#c8daf1"/>
    <text class="component-copy-strong" x="581" y="343">Owns the workflow</text>
    <g transform="translate(581 364)">
      <rect width="208" height="48" rx="12" fill="#ffffff" stroke="#cbdcf2"/>
      <circle cx="21" cy="24" r="9" fill="#eaf2ff"/>
      <text x="21" y="28" font-size="11" text-anchor="middle" font-weight="800" fill="#2563eb">A</text>
      <text class="small" x="40" y="21">Route ingestion</text>
      <text class="small" x="40" y="39">and schema preview</text>
    </g>
    <g transform="translate(581 424)">
      <rect width="208" height="58" rx="12" fill="#ffffff" stroke="#cbdcf2"/>
      <circle cx="21" cy="29" r="9" fill="#eaf2ff"/>
      <text x="21" y="33" font-size="11" text-anchor="middle" font-weight="800" fill="#2563eb">K</text>
      <text class="small" x="40" y="24">Run SQL candidates</text>
      <text class="small" x="40" y="43">in parallel</text>
    </g>
    <g transform="translate(581 494)">
      <rect width="208" height="82" rx="12" fill="#ffffff" stroke="#cbdcf2"/>
      <circle cx="21" cy="30" r="9" fill="#fff3d6"/>
      <path d="M17 30h8M21 26v8" stroke="#a96f08" stroke-width="1.6"/>
      <text class="small" x="40" y="23">Return result or</text>
      <text class="small" x="40" y="42">clarification; enforce</text>
      <text class="small" x="40" y="61">answered meaning</text>
    </g>
    <text x="581" y="604" font-size="12.5" font-weight="650" fill="#4b6179">Typed workflow result → UI</text>
  </g>

  <!-- Core services -->
  <g id="etl-service" filter="url(#smallShadow)">
    <rect class="card" x="867" y="184" width="375" height="122" rx="20"/>
    <rect x="867" y="184" width="7" height="122" rx="3.5" fill="#06b6d4"/>
    <circle cx="912" cy="224" r="19" fill="#e7f9fc"/>
    <ellipse cx="912" cy="217" rx="10" ry="4" fill="none" stroke="#0891b2" stroke-width="2"/>
    <path d="M902 217v12c0 5 20 5 20 0v-12M902 223c0 5 20 5 20 0" fill="none" stroke="#0891b2" stroke-width="2"/>
    <circle cx="1214" cy="207" r="14" fill="#0891b2"/>
    <text class="number" x="1214" y="207">A</text>
    <text class="component-kicker" x="944" y="214" fill="#0891b2">DATA PREPARATION</text>
    <text class="component-title" x="944" y="239">ETL Service</text>
    <text class="component-copy" x="892" y="271">CSV → DuckDB · exact schema · relationships</text>
  </g>

  <g id="semantic-analysis" filter="url(#smallShadow)">
    <rect class="card" x="867" y="337" width="375" height="122" rx="20"/>
    <rect x="867" y="337" width="7" height="122" rx="3.5" fill="#8b5cf6"/>
    <circle cx="912" cy="377" r="19" fill="#f3efff"/>
    <circle cx="908" cy="373" r="7" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M913 379l7 7" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="1214" cy="360" r="14" fill="#7c3aed"/>
    <text class="number" x="1214" y="360">B1</text>
    <text class="component-kicker" x="944" y="367" fill="#7c3aed">PRE-SQL EVIDENCE</text>
    <text class="component-title" x="944" y="392">Semantic analyzer</text>
    <text class="component-copy" x="892" y="424">Map unresolved terms to schema columns</text>
    <text class="component-copy" x="892" y="447">Retain findings as non-blocking evidence</text>
  </g>

  <g id="query-service" filter="url(#smallShadow)">
    <rect class="card" x="867" y="490" width="375" height="144" rx="20"/>
    <rect x="867" y="490" width="7" height="144" rx="3.5" fill="#2563eb"/>
    <circle cx="912" cy="531" r="19" fill="#eaf2ff"/>
    <path d="M905 526l-5 5 5 5M919 526l5 5-5 5M915 522l-6 18" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1214" cy="513" r="14" fill="#2563eb"/>
    <text class="number" x="1214" y="513">C</text>
    <text class="component-kicker" x="944" y="520" fill="#2563eb">K PARALLEL LANES</text>
    <text class="component-title" x="944" y="545">Querier</text>
    <text class="component-copy" x="892" y="576">Link schema + build context · generate SQL</text>
    <text class="component-copy" x="892" y="603">validate one read-only SELECT · execute</text>
  </g>

  <g id="ambiguity-service" filter="url(#smallShadow)">
    <rect x="867" y="664" width="375" height="126" rx="20" fill="url(#decision)" stroke="#b9e0dd" stroke-width="1.5"/>
    <rect x="867" y="664" width="7" height="126" rx="3.5" fill="#059669"/>
    <circle cx="912" cy="704" r="19" fill="#e8f7f1"/>
    <path d="M902 699h7l4-5M909 699l4 5M913 704h8M921 704l-4-4M921 704l-4 4" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1214" cy="687" r="14" fill="#059669"/>
    <text class="number" x="1214" y="687">B2</text>
    <text class="component-kicker" x="944" y="694" fill="#047857">POST-SQL DECISION</text>
    <text class="component-title" x="944" y="719">Unified ambiguity judge</text>
    <text class="component-copy" x="892" y="750">Cluster executed SQL + results · retain support</text>
    <text class="component-copy" x="892" y="774">Pass, clarify, or verify compliance</text>
  </g>

  <!-- Foundation -->
  <g id="shared-contracts">
    <rect x="292" y="688" width="522" height="102" rx="18" fill="#f8fafc" stroke="#d9e2ec" stroke-width="1.3"/>
    <text class="component-kicker" x="316" y="716" fill="#64748b">SHARED CONTRACTS</text>
    <text class="component-title" x="316" y="744">Typed hand-offs</text>
    <text class="small" x="316" y="771">schema · candidates · results · decisions</text>
    <line x1="558" y1="706" x2="558" y2="773" stroke="#d9e2ec"/>
    <text class="component-kicker" x="580" y="716" fill="#64748b">PROMPT + EVENT LOGGING</text>
    <text x="580" y="744" font-size="17" font-weight="720">Cross-cutting audit</text>
    <text class="small" x="580" y="771">app + all LLM clients</text>
  </g>

  <!-- External runtimes -->
  <g id="openrouter" filter="url(#smallShadow)">
