    <rect x="1347" y="474" width="207" height="8" rx="4" fill="#f4b400"/>
    <circle cx="1384" cy="520" r="19" fill="#fff8df"/>
    <ellipse cx="1384" cy="514" rx="10" ry="4" fill="none" stroke="#a96f08" stroke-width="2"/>
    <path d="M1374 514v13c0 5 20 5 20 0v-13M1374 521c0 5 20 5 20 0" fill="none" stroke="#a96f08" stroke-width="2"/>
    <text class="component-kicker" x="1415" y="512" fill="#9a6810">SESSION DATABASE</text>
    <text class="component-title" x="1415" y="537">DuckDB</text>
    <text class="component-copy" x="1371" y="574">Imported tables</text>
    <text class="component-copy" x="1371" y="600">Schema profiling</text>
    <text class="component-copy" x="1371" y="626">Read-only execution</text>
  </g>

  <g id="prompt-log" filter="url(#smallShadow)">
